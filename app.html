<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Papan Pemuka · SIGAP</title>
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" type="image/svg+xml" href="assets/img/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body class="app">
  <aside class="sidebar" id="sidebar">
    <a href="#/dashboard" class="brand"><img src="assets/img/logo.svg" alt="" width="36" height="36"><span>SIGAP</span></a>
    <div class="school" id="schoolName"></div>
    <nav class="side-nav" id="sideNav" aria-label="Navigasi utama"></nav>
    <div class="side-user" id="sideUser"></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <a href="#/dashboard" class="brand topbar-brand"><img src="assets/img/logo.svg" alt="" width="30" height="30"><span>SIGAP</span></a>
      <div class="topbar-title" id="pageTitle"></div>
      <div class="topbar-right">
        <span class="today-chip" id="todayChip"></span>
        <span class="mode-chip" id="modeChip"></span>
        <div class="menu-wrap">
          <button class="avatar-btn" id="avatarBtn" aria-haspopup="true" aria-expanded="false"></button>
          <div class="menu" id="userMenu" hidden></div>
        </div>
      </div>
    </header>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <nav class="bottom-nav" id="bottomNav" aria-label="Navigasi mudah alih"></nav>

  <div class="modal-root" id="modalRoot" hidden></div>
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="assets/js/icons.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
